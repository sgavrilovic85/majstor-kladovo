<!DOCTYPE html>
<html lang="sr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel majstora</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--p:#1b3a7a;--n:#f26a1b;--z:#1f9d55}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f2f4f8;color:#1d2433}
header{background:var(--p);color:#fff;text-align:center;padding:14px}header h1{margin:0;font-size:20px}
main{max-width:560px;margin:0 auto;padding:12px}
.k{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
input,textarea,select{width:100%;padding:11px;border:1px solid #cfd5e3;border-radius:10px;font-size:16px;font-family:inherit;margin-top:6px}
button{padding:12px;border:0;border-radius:10px;font-size:15px;font-weight:700;background:var(--p);color:#fff}
.nar{background:var(--n)}.zel{background:var(--z)}.sv{background:#e6e9f1;color:#1d2433}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px 4px #0002}
.tabs button{flex:1;background:none;color:#6b7385;border-radius:0;border-bottom:3px solid transparent}
.tabs button.on{color:var(--p);border-color:var(--n)}
.p{display:none}.p.on{display:block}
.poz{display:flex;gap:10px}.poz img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#e6e9f1;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chips button{padding:7px 10px;font-size:13px;background:#e9effc;color:var(--p)}
.red{display:flex;gap:8px;margin-top:8px}.red>*{flex:1}
.b{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;background:#d94b3d}
.dani{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dani button{background:#fff;color:#1d2433;border:2px solid #dde2ee;padding:9px 2px;font-size:13px}
.dani button.on{background:var(--z);color:#fff;border-color:var(--z)}
a{color:var(--p);font-weight:700}
</style></head><body>
<header><h1>🛠️ Panel majstora</h1></header>
<main>
<div class="k" id="login"><b>Unesite vaš PIN</b>
 <input id="pin" type="password" inputmode="numeric" placeholder="PIN (6 cifara)">
 <div class="red"><button class="nar" onclick="ulaz()">Uđi</button></div></div>
<div id="app" style="display:none">
 <div class="k"><b id="ime"></b></div>
 <div class="tabs"><button class="on" data-t="poz">Pozivi</button><button data-t="cen">Cenovnik</button><button data-t="kal">Kalendar</button><button data-t="upl">Uplata</button></div>
 <div style="height:12px"></div>
 <section class="p on" id="poz"></section>
 <section class="p" id="cen"><div class="k"><div id="redovi"></div>
  <div class="red"><button class="sv" onclick="cen.push({naziv:'',cena:''});crtCen()">+ Dodaj uslugu</button><button class="zel" onclick="snimiCen()">Sačuvaj</button></div></div></section>
 <section class="p" id="upl"><div class="k"><b>Podaci za uplatu preko banke</b>
  <p style="font-size:13px;color:#6b7385;margin:4px 0 6px">Ovo se upisuje u QR kod koji klijent skenira. Proverite broj računa.</p>
  <input id="u-naziv" placeholder="Ime i prezime ili naziv firme/radnje">
  <input id="u-racun" inputmode="numeric" placeholder="Žiro račun, npr. 160-0000000000000-00">
  <input id="u-mesto" placeholder="Mesto (npr. Kladovo)">
  <div class="red"><button class="zel" onclick="snimiUplatu()">Sačuvaj podatke</button></div></div></section>
 <section class="p" id="kal"><div class="k"><b>Obeleži dane kad si slobodan</b><p style="font-size:13px;color:#6b7385;margin:4px 0 10px">Zeleno = slobodan. Klijenti vide najbliži slobodan termin.</p>
  <div class="dani" id="dani"></div><div class="red"><button class="zel" onclick="snimiKal()">Sačuvaj kalendar</button></div></div></section>
</div>
</main>
<div id="qrm" style="display:none;position:fixed;inset:0;background:#000b;z-index:60;align-items:center;justify-content:center;padding:16px"><div style="background:#fff;border-radius:16px;padding:20px;text-align:center;max-width:340px">
 <h3 style="margin:0 0 10px">💳 QR za uplatu</h3><div id="qrslika" style="display:inline-block;background:#fff;padding:8px"></div>
 <p id="qrinfo" style="font-size:14px"></p><button style="width:100%" onclick="$('qrm').style.display='none'">Zatvori</button></div></div>
<script>
const SUPABASE_URL="https://ulbqtvdcepkgawcdfgud.supabase.co";
const SUPABASE_KEY="sb_publishable_r6_CzN6zP-asRrcoUZHT7w_pwyt5uS5";
const IZLAZAK=3000;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fd=s=>s?new Date(s).toLocaleDateString("sr-RS",{day:"2-digit",month:"2-digit",year:"numeric"}):"";
const sb=(SUPABASE_URL&&SUPABASE_KEY)?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let PIN="",M=null,cen=[],dani=new Set(),lista=[];
try{$("pin").value=localStorage.getItem("mpin")||""}catch(e){}

async function ulaz(){
 if(!sb)return alert("Dodaj Supabase ključeve u kod.");
 const pin=$("pin").value.trim();
 const r=await sb.rpc("m_prijava",{p_pin:pin});
 if(r.error||!r.data)return alert("Pogrešan PIN.");
 PIN=pin;M=r.data;try{localStorage.setItem("mpin",pin)}catch(e){}
 cen=M.cenovnik||[];dani=new Set((M.slobodni||[]).map(d=>String(d).slice(0,10)));
 $("login").style.display="none";$("app").style.display="block";$("ime").textContent=M.ime+" – "+(M.kategorije||[]).join(", ");
 $("u-naziv").value=M.naziv_uplata||"";$("u-racun").value=M.racun||"";$("u-mesto").value=M.mesto_uplata||"";
 crtCen();crtKal();pozivi();}

document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));
 document.querySelectorAll(".p").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));
 if(b.dataset.t==="poz")pozivi();});

let MOJE={};
async function pozivi(){
 const [r,o]=await Promise.all([sb.rpc("m_pozivi",{p_pin:PIN}),sb.rpc("m_ponude",{p_pin:PIN})]);
 lista=r.data||[];MOJE={};(o.data||[]).forEach(x=>MOJE[x.poziv_id]=x);
 $("poz").innerHTML=lista.length?lista.map(p=>{
  const moj=p.majstor_id===M.id,zav=p.status==="Završeno",prihv=["Prihvaćeno","U toku"].includes(p.status),mo=MOJE[p.id];
  const info=mo?` · tvoja ponuda ${mo.cena} din (${mo.status==="Poslata"?"čeka klijenta":mo.status})`:(p.cena&&moj?" · "+p.cena+" din":"");
  return `<div class="k"><div class="poz">
  <div><b>${esc(p.kategorija)}</b> <span class="b">${esc(p.hitnost)}</span><br>${esc(p.opis)||"<i>bez opisa</i>"}<br>
  📍 ${esc(p.adresa)} ${p.lat?`<a target="_blank" href="https://maps.google.com/?q=${p.lat},${p.lng}">mapa</a>`:""}<br>
  📞 <a href="tel:${esc(p.telefon)}">${esc(p.telefon)}</a><br><small>${fd(p.created_at)} · <b>${esc(p.status)}</b>${info}</small></div></div>
  ${galerija(p)}
  ${prihv&&moj?`<div style="margin-top:8px;padding:10px;background:#ecfdf5;border-radius:10px"><b>✅ Klijent je prihvatio tvoju ponudu</b> – ${esc(p.cena)} din, dolaziš ${fd(p.termin)}${p.termin_vreme?" u "+String(p.termin_vreme).slice(0,5):""}</div>
  <div class="red"><button class="sv" onclick="stat(${p.id},'U toku')">U toku</button><button class="zel" onclick="stat(${p.id},'Završeno')">Završeno</button></div>`:""}
  ${(zav||prihv)?"":`<div class="chips">${cen.map((x,i)=>`<button onclick="chip(${p.id},${i})">${esc(x.naziv)} ${esc(x.cena)}</button>`).join("")}<button onclick="izlazak(${p.id})">Samo izlazak ${IZLAZAK}</button></div>
  <input id="c${p.id}" type="number" inputmode="numeric" oninput="IZL[${p.id}]=false" placeholder="Cena (din)" value="${mo?mo.cena:""}">
  <input id="o${p.id}" placeholder="Napomena (šta je u ceni)" value="${esc(mo?mo.opis||"":"")}">
  <div style="font-size:13px;color:#6b7385;margin-top:8px">Kada stižete na adresu:</div>
  <div class="chips"><button onclick="za(${p.id},30)">Za 30 min</button><button onclick="za(${p.id},60)">Za 1 h</button><button onclick="za(${p.id},120)">Za 2 h</button></div>
  <div class="red"><input id="t${p.id}" type="date" value="${mo?mo.termin||"":""}"><input id="v${p.id}" type="time" value="${esc(String(mo?mo.termin_vreme||"":"").slice(0,5))}"></div>
  <div class="red"><button class="nar" onclick="ponuda(${p.id})">${mo&&mo.status==="Poslata"?"Izmeni ponudu":"Pošalji ponudu"}</button></div>`}${placanjeBlok(p,moj)}</div>`}).join(""):'<div class="k">Nema poziva za vaše kategorije.</div>';}

function galerija(p){
 const l=(p.foto_urls&&p.foto_urls.length)?p.foto_urls:(p.foto_url?[p.foto_url]:[]);
 return l.length?`<div style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">${l.map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}" alt="" style="width:92px;height:92px;object-fit:cover;border-radius:8px"></a>`).join("")}</div>`:"";
}
function placanjeBlok(p,moj){
 if(!moj||!p.cena_klijent)return "";
 const iznos=Number(p.cena_klijent).toLocaleString("sr-RS"),banka=p.placanje==="banka";
 if(p.placeno)return `<div style="margin-top:10px;padding:10px;background:#ecfdf5;border-radius:10px"><b>✅ Plaćeno</b> – ${iznos} din (${banka?"banka":"keš"})</div>`;
 return `<div style="margin-top:10px;padding:10px;background:#fff7e6;border-radius:10px"><b>${banka?"🏦 Plaća preko banke (QR)":"💵 Plaća kešom"}</b> – ${iznos} din
 <div class="red">${banka?`<button class="nar" onclick="prikaziQR(${p.id},${p.cena_klijent})">💳 Prikaži QR</button>`:""}<button class="zel" onclick="placeno(${p.id})">✅ ${banka?"Plaćeno":"Naplaćeno kešom"}</button></div></div>`}
async function prikaziQR(id,iznos){
 const r=await sb.rpc("m_qr",{p_pin:PIN,p_id:id});
 if(r.error||!r.data)return alert(r.error?r.error.message:"QR nije dostupan.");
 $("qrslika").innerHTML="";
 new QRCode($("qrslika"),{text:r.data,width:260,height:260,correctLevel:QRCode.CorrectLevel.M});
 $("qrinfo").textContent="Iznos: "+Number(iznos).toLocaleString("sr-RS")+" din. Klijent skenira u aplikaciji svoje banke.";
 $("qrm").style.display="flex";
}
async function placeno(id){
 if(!confirm("Potvrđujete da je uplata primljena? QR kod će nestati."))return;
 const r=await sb.rpc("m_placeno",{p_pin:PIN,p_id:id});if(r.error)alert(r.error.message);pozivi();
}
async function snimiUplatu(){
 const r=await sb.rpc("m_uplata",{p_pin:PIN,p_naziv:$("u-naziv").value,p_racun:$("u-racun").value,p_mesto:$("u-mesto").value});
 if(r.error)return alert(r.error.message);
 alert("Podaci za uplatu sačuvani ✅");M.naziv_uplata=$("u-naziv").value;
}
const IZL={};
function chip(id,i){IZL[id]=false;$("c"+id).value=cen[i].cena;$("o"+id).value=cen[i].naziv}
function izlazak(id){IZL[id]=true;$("c"+id).value=IZLAZAK;$("o"+id).value="Samo izlazak majstora na teren"}
function za(id,min){const d=new Date(Date.now()+min*60000);$("t"+id).value=iso(d);$("v"+id).value=d.toTimeString().slice(0,5)}
async function ponuda(id){
 const c=parseInt($("c"+id).value);if(!c)return alert("Upiši cenu.");
 const p=lista.find(x=>x.id===id)||{};
 if(!$("t"+id).value||!$("v"+id).value)return alert("Upiši datum i sat kada stižeš"+(p.hitnost==="Hitno danas"?" (hitna intervencija!)":"")+".");
 const r=await sb.rpc("m_ponuda",{p_pin:PIN,p_id:id,p_cena:c,p_opis:$("o"+id).value,p_termin:$("t"+id).value,p_vreme:$("v"+id).value,p_izlazak:!!IZL[id]});
 if(r.error)return alert("Greška: "+r.error.message);pozivi();}
async function stat(id,s){const r=await sb.rpc("m_status",{p_pin:PIN,p_id:id,p_status:s});if(r.error)alert(r.error.message);pozivi();}

function crtCen(){$("redovi").innerHTML=cen.length?cen.map((x,i)=>`<div class="red"><input style="flex:2" placeholder="Usluga (npr. zamena sifona)" value="${esc(x.naziv)}" oninput="cen[${i}].naziv=this.value">
 <input type="number" placeholder="din" value="${esc(x.cena)}" oninput="cen[${i}].cena=this.value"><button class="sv" style="flex:0 0 44px" onclick="cen.splice(${i},1);crtCen()">✕</button></div>`).join(""):"<p>Cenovnik je prazan. Dodaj usluge i cene.</p>";}
async function snimiCen(){const r=await sb.rpc("m_cenovnik",{p_pin:PIN,p_c:cen.filter(x=>x.naziv)});alert(r.error?r.error.message:"Cenovnik sačuvan ✅");pozivi();}

const iso=d=>d.toLocaleDateString("sv-SE");
function crtKal(){const h=[];for(let i=0;i<28;i++){const d=new Date();d.setDate(d.getDate()+i);const k=iso(d);
 h.push(`<button class="${dani.has(k)?"on":""}" onclick="tg('${k}',this)">${d.toLocaleDateString("sr-RS",{weekday:"short"})}<br>${d.getDate()}.${d.getMonth()+1}.</button>`)}
 $("dani").innerHTML=h.join("");}
function tg(k,b){dani.has(k)?dani.delete(k):dani.add(k);b.classList.toggle("on")}
async function snimiKal(){const r=await sb.rpc("m_slobodni",{p_pin:PIN,p_dani:[...dani]});alert(r.error?r.error.message:"Kalendar sačuvan ✅");}
</script></body></html>
