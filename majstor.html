<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrolna tabla – Majstor na terenu</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--plava:#1b3a7a;--nar:#f26a1b;--zel:#1f9d55;--bg:#f2f4f8;--k:#fff;--tx:#1d2433;--sv:#6b7385}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding:12px}
header{background:var(--plava);color:#fff;text-align:center;padding:14px;border-radius:12px;margin-bottom:12px}
header h1{margin:0;font-size:20px}
.sekcija{background:var(--k);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.sekcija h3{margin:0 0 10px;font-size:16px;color:var(--plava)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid #eee;text-align:left}
th{background:#f8f9fc;color:var(--sv)}
.bedz{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:#fff}
.Novo{background:#d94b3d}.U-toku{background:#e0a100}.Zavrseno{background:var(--zel)}
button{padding:8px 14px;border:0;border-radius:8px;background:var(--plava);color:#fff;font-weight:600;cursor:pointer}
button.sekundarno{background:#e9effc;color:var(--plava)}
.prioritet-1{background:#fff8e1;font-weight:bold;}
</style>
</head>
<body>
<header>
  <h1>⚙️ Kontrolna tabla za majstore</h1>
  <p style="margin:4px 0 0;font-size:13px;color:#b9cdf5;">Sistem prioriteta i raspored</p>
</header>

<main>
 <div class="sekcija">
  <h3>👷 Lista majstora (Rangirani po prioritetu)</h3>
  <div id="lista-majstora">Učitavanje...</div>
 </div>

 <div class="sekcija">
  <h3>📋 Pristigli pozivi građana</h3>
  <div id="lista-poziva">Učitavanje poziva...</div>
 </div>
</main>

<script>
// ===== PODEŠAVANJA =====
const SUPABASE_URL = "https://ulbqtvdcepkgawcdfqud.supabase.co";
const SUPABASE_KEY = "sb_publishable_r6_CzN6zP-asRrCoUZHT7w_pwyt5uS5";
// =================================
const sb=(SUPABASE_URL&&SUPABASE_KEY&&window.supabase)?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
const $=id=>document.getElementById(id);

async function ucitajPodatke(){
  if(!sb){
    $("lista-majstora").innerHTML="Supabase nije podešen u kodu.";
    $("lista-poziva").innerHTML="Supabase nije podešen u kodu.";
    return;
  }

  // 1. Učitavanje majstora sortiranih po prioritetu (1 je najviši prioritet)
  const resM = await sb.from("majstori").select("*").order("prioritet", { ascending: true });
  const majstori = resM.data || [];
  
  if(majstori.length === 0){
    $("lista-majstora").innerHTML="<p>Nema unetih majstora u bazi.</p>";
  } else {
    let htmlM = `<table><tr><th>Prioritet</th><th>Ime</th><th>Telefon</th><th>Kategorije</th></tr>`;
    majstori.forEach(m => {
      htmlM += `<tr class="${m.prioritet === 1 ? 'prioritet-1' : ''}">
        <td>⭐ ${m.prioritet}</td>
        <td><b>${m.ime}</b> ${m.prioritet === 1 ? '(Glavni / Prednost)' : ''}</td>
        <td>${m.telefon || '-'}</td>
        <td>${(m.kategorije || []).join(", ")}</td>
      </tr>`;
    });
    htmlM += `</table>`;
    $("lista-majstora").innerHTML = htmlM;
  }

  // 2. Učitavanje poziva
  const resP = await sb.from("pozivi").select("*").order("created_at", { ascending: false }).limit(20);
  const pozivi = resP.data || [];

  if(pozivi.length === 0){
    $("lista-poziva").innerHTML="<p>Nema pristiglih poziva.</p>";
  } else {
    let htmlP = `<table><tr><th>Kategorija</th><th>Adresa / Telefon</th><th>Status</th></tr>`;
    pozivi.forEach(p => {
      htmlP += `<tr>
        <td><b>${p.kategorija}</b><br><small>${p.hitnost}</small></td>
        <td>${p.adresa}<br><small>${p.telefon}</small></td>
        <td><span class="bedz ${p.status}">${p.status}</span></td>
      </tr>`;
    });
    htmlP += `</table>`;
    $("lista-poziva").innerHTML = htmlP;
  }
}

ucitajPodatke();
</script>
</body>
</html>
