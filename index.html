<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majstor na terenu - Kladovo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--plava:#1b3a7a;--nar:#f261b;--zel:#1f9d55;--bg:#f2f4f8;--k:#fff;--tx:#1d2433;--sv:#6b7385}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);padding-bottom:80px}
header{background:var(--plava);color:#fff;text-align:center;padding:14px 12px 12px}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;font-size:13px;color:#b9cdf5}
.tabs{display:flex;background:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px #0002}
.tabs button{flex:1;padding:13px 4px;border:0;background:none;font-size:14px;font-weight:600;color:var(--sv);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--plava);border-color:var(--plava)}
main{max-width:560px;margin:0 auto;padding:12px}
.sek{background:var(--k);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
.sek h3{margin:0 0 10px;font-size:16px}
input,textarea,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font-size:14px;margin-top:6px}
button.glavno{width:100%;background:var(--nar);color:#fff;border:0;padding:14px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer;margin-top:10px}
.pr{display:none}
.pr.on{display:block}
</style>
</head>
<body>

<header>
  <h1>🛠️ Majstor na terenu</h1>
  <p>Uslikaj kvar, mi šaljemo majstora – Kladovo</p>
</header>

<div class="tabs">
  <button data-t="prijava" class="on">Pozovi majstora</button>
  <button data-t="mapa">Mapa</button>
  <button data-t="status">Status</button>
  <button data-t="majstori">Majstori</button>
</div>

<main>
  <!-- 1. PRIJAVA KVARA -->
  <div id="prijava" class="pr on">
    <div class="sek">
      <h3>1. Šta vam treba?</h3>
      <div id="kategorije-div"></div>
    </div>
    <div class="sek">
      <h3>2. Opis kvara</h3>
      <textarea id="opis" rows="3" placeholder="Npr. curi ventil u kupatilu..."></textarea>
    </div>
    <div class="sek">
      <h3>3. Vaš telefon</h3>
      <input type="text" id="tel" placeholder="0631234567">
    </div>
    <button class="glavno" id="slanje">POŠALJI POZIV MAJSTORU</button>
  </div>

  <!-- 2. MAPA -->
  <div id="mapa-s" class="pr">
    <div class="sek">
      <h3>Aktivne lokacije i kvarovi</h3>
      <div id="map" style="height:400px;border-radius:10px;"></div>
    </div>
  </div>

  <!-- 3. STATUS -->
  <div id="status" class="pr">
    <div class="sek">
      <h3>Status vašeg poziva</h3>
      <div id="status-sadrzaj">Unesite telefon da proverite status.</div>
    </div>
  </div>

  <!-- 4. MAJSTORI (DIREKTNA BAZA) -->
  <div id="majstori" class="pr">
    <div class="sek">
      <h3>BAZA MAJSTORA</h3>
      <button onclick="ucitajMajstore()" style="width:100%;margin-bottom:15px;padding:10px;background:#e2e8f0;border:0;border-radius:8px;font-weight:bold;cursor:pointer">🔄 OSVEŽI LISTU</button>
      <div id="majstori-list">Učitavanje...</div>
      
      <hr style="margin:20px 0;border:0;border-top:1px solid #eee">
      
      <h3>DODAJ NOVOG MAJSTORA</h3>
      <input type="text" id="m-ime" placeholder="Ime i prezime">
      <input type="text" id="m-telefon" placeholder="Telefon, npr. 0631234567">
      <div id="m-kats" style="margin:10px 0"></div>
      <button onclick="dodajMajstora()" style="width:100%;margin-top:10px;background:var(--plava);color:#fff;border:0;padding:12px;border-radius:8px;font-weight:bold;cursor:pointer">SAČUVAJ MAJSTORA</button>
    </div>
  </div>
</main>

<script>
const SUPABASE_URL = "https://ulbqtvdcepkgawcdfqud.supabase.co";
const SUPABASE_KEY = "sb_publishable_r6_CzN6zP-asRrCoUZHT7w_pwyt5uS5";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const KATS = [["Vodoinstalater","🚰"],["Električar","⚡"],["Grejanje / Klima","🔥"],["Čišćenje","🧹"],["Limar","🏠"],["Lift","🛗"],["Pomoć u kući","🧹"],["Keramičar","🧱"],["Moler","🎨"],["Bašta / Dvorište","🌳"],["Građevinar","🏗️"]];
let kat = "";

// Inicijalizacija kategorija na formi
$("kategorije-div").innerHTML = KATS.map(([k,i]) => `<button onclick="izaberiKat('${k}',this)" style="margin:4px;padding:8px 12px;border:1px solid #cbd5e1;background:#fff;border-radius:20px;cursor:pointer">${i} ${k}</button>`).join("");
$("m-kats").innerHTML = KATS.map(([k]) => `<label style="display:inline-block;margin:4px 8px"><input type="checkbox" value="${k}"> ${k}</label>`).join("");

function izaberiKat(k, btn) {
  document.querySelectorAll("#kategorije-div button").forEach(b => b.style.background = "#fff");
  btn.style.background = "#e2e8f0";
  kat = k;
}

// Upravljanje tabovima bez PIN-a
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => {
    const t = b.dataset.t;
    document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("on", x === b));
    document.querySelectorAll(".pr").forEach(p => p.classList.remove("on"));
    
    const aktivni = $(t === "mapa" ? "mapa-s" : t);
    if(aktivni) aktivni.classList.add("on");
    
    if(t === "mapa") crtajMapu();
    if(t === "status") crtajStatus();
    if(t === "majstori") ucitajMajstore();
});

// Direktne funkcije ka tabeli 'majstori' (bez RPC i PIN grešaka)
async function ucitajMajstore() {
  const el = $("majstori-list");
  if(!el) return;
  el.textContent = "Učitavanje...";
  
  const { data, error } = await sb.from('majstori').select('*').order('id', { ascending: true });
  if(error) {
    el.innerHTML = `<b style="color:#c00">Greška: ${error.message}</b>`;
    return;
  }
  
  if(!data || data.length === 0) {
    el.innerHTML = "<p>Nema unetih majstora.</p>";
    return;
  }
  
  el.innerHTML = data.map(m => `
    <div style="border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:10px;background:#fff">
      <b>${esc(m.ime)}</b><br>
      <small>Kategorije: ${esc(Array.isArray(m.kategorije) ? m.kategorije.join(", ") : m.kategorije)}</small><br>
      📞 ${esc(m.telefon)} · PIN: <b>${esc(m.pin || 'N/A')}</b><br>
      <button style="margin-top:8px;background:#ef4444;color:#fff;border:0;padding:5px 12px;border-radius:6px;cursor:pointer" onclick="obrisiMajstora(${m.id})">Obriši</button>
    </div>
  `).join("");
}

async function dodajMajstora() {
  const ime = $("m-ime").value.trim();
  const tel = $("m-telefon").value.trim();
  const kk = [...document.querySelectorAll("#m-kats input:checked")].map(x => x.value);
  
  if(!ime || !tel || !kk.length) return alert("Upiši ime, telefon i izaberi bar jednu kategoriju.");
  
  const randomPin = Math.floor(1000 + Math.random() * 9000).toString();
  
  const { error } = await sb.from('majstori').insert([{
    ime: ime,
    telefon: tel,
    kategorije: kk,
    pin: randomPin
  }]);
  
  if(error) return alert("Greška pri čuvanju: " + error.message);
  
  alert("Majstor uspešno sačuvan! PIN: " + randomPin);
  $("m-ime").value = "";
  $("m-telefon").value = "";
  document.querySelectorAll("#m-kats input").forEach(x => x.checked = false);
  ucitajMajstore();
}

async function obrisiMajstora(id) {
  if(!confirm("Da li sigurno želiš da obrišeš majstora?")) return;
  const { error } = await sb.from('majstori').delete().eq('id', id);
  if(error) return alert("Greška pri brisanju: " + error.message);
  ucitajMajstore();
}

function crtajMapu() {}
function crtajStatus() {}
</script>
</body>
</html>
